# Projects shown on /projects/, rendered by layouts/shortcodes/projects.html
#
# Fields (only title and start are required):
#   title     short name of the project
#   subtitle  full title or one-line description
#   url       project website
#   funder    funding body / programme
#   partners  partner institutions
#   role      your role, e.g. "Principal investigator", "Co-PI", "Coordinator", "Member"
#   start     first year (number)
#   end       last year (number); leave out for open-ended projects
#   status    optional override: "ongoing" or "finished"
#
# Without "status", a project counts as ongoing while it has no end year or its end year
# is the current year or later. It moves to "Finished" automatically at the next build.
#
# Order in this file does not matter: ongoing projects are sorted by start year,
# finished projects by end year (newest first).

